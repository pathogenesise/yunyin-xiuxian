name: 构建多平台程序 (Electron & Android)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'

# 同一分支只留一条流水线。两个 run 同时进 release job,会在同一个 tag 下
# 「先删旧资产、再传新资产」,互相删掉对方刚传的文件,Release 里就会缺东西。
# 用 cancel-in-progress: false 而不是 true —— 取消进行中的 run,有可能正好
# 砍在「已删完、还没传完」的窗口里,留下一个资产不全的 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. 构建 Electron 客户端
  build-electron:
    name: 构建 Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 过闸才继续:lint/类型检查/单测任意一条红,构建与发布都停在这
      - name: 静态检查 + 单元测试
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

      - name: 缓存 Electron Builder
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: 构建 Electron
        run: bun run build:electron --${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 【关键点】上传 zip 产物
      - name: 上传 Electron 安装包
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            pkg/*.zip

  # 2. 构建 Android APK
  build-android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 静态检查 + 单元测试
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      # 使用官方 Gradle Action（内置智能缓存）
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 构建前端
        run: bun run build

      - name: 同步 Capacitor
        run: bunx cap sync android

      # 签名口令走 Secrets 注入(不落在仓库文件里)。
      # 没配 secret 时 gradle 会静默产出「未签名 APK」——那种包手机根本装不上。
      # 与其让 CI 绿着吐一个废包,不如红着把话说明白:下面是硬闸门。
      - name: 校验签名 Secret 已配置
        if: ${{ secrets.KEYSTORE_STORE_PASSWORD == '' || secrets.KEYSTORE_KEY_PASSWORD == '' }}
        run: |
          echo "::error::未配置 KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_PASSWORD —— 请在仓库 Settings → Secrets and variables → Actions 添加这两个 secret(值 = android/release.keystore 的原口令)"
          exit 1

      - name: 构建 APK (Release)
        working-directory: android
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  # 3. 发布 Release
  release:
    needs: [build-electron, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 获取版本号
        id: get_version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      # 1. 下载时，不使用 merge-multiple，防止覆盖冲突
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./raw-assets

      # 2. 核心步骤：手动移动文件到一个扁平目录，并强制重命名
      - name: 整理并重命名产物
        run: |
          mkdir -p ./final-release

          # 移动 Electron zip 包
          find ./raw-assets/electron-* -type f -name "*.zip" -exec cp {} ./final-release/ \;

          # 移动 Android APK
          find ./raw-assets/android-apk -type f -name "*.apk" -exec cp {} ./final-release/ \; || true

          # 检查结果
          echo "Final assets to upload:"
          ls -R ./final-release

      # 3. 删除已有 Release 的文件（如果存在）
      - name: 删除已有 Release 资产
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          # 获取 release 的所有资产并删除
          gh release view "$VERSION" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
            echo "Deleting asset: $asset"
            gh release delete-asset "$VERSION" "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 4. 上传新文件
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: ./final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
