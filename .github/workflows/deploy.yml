name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # enable-pages 需要它来建站(仓库级 administration 权限,GITHUB_TOKEN 自带)
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 静态检查 + 单元测试
        run: |
          bun run check
          bun run test:report
      - name: 构建
        run: bun run build
      # 前置条件:仓库需在 Settings → Pages → Build and deployment 里把 Source 选成
      # GitHub Actions。configure-pages 拿不到站点就会直接失败(Not Found)。
      #
      # enable-pages 在站点尚不存在时先把站点建出来(build_type=workflow),
      # 用的是 GITHUB_TOKEN 的 administration:write —— 仓库级权限即可,
      # 不需要额外的 PAT 凭据(这正是 configure-pages 的 enablement:true 所缺的)。
      # 建站之后 configure-pages 才能拿到站点。
      - name: 启用 Pages(首次建站)
        if: ${{ github.repository_owner != 'setube' }}
        uses: actions/enable-pages@v5
        with:
          build_type: workflow
      - name: 配置 Pages
        uses: actions/configure-pages@v6
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v5
